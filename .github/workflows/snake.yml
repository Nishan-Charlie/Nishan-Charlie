name: Generate Snake

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nishan-Charlie
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9a6700&color_dots=#ebedf0,#d0d7de,#afb8c1,#8c959f,#6e7781
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e3b341&color_dots=#161b22,#30363d,#484f58,#6e7681,#8b949e

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
